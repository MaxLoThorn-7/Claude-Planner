<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Weekly Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>

    /* ── Variables ─────────────────────────────────────── */
    :root {
      --orange:      #D97706;
      --orange-dk:   #B45309;
      --orange-pale: #FFFBEB;
      --orange-tint: rgba(217, 119, 6, 0.055);
      --ink:         #1C1917;
      --ink-mid:     #57534E;
      --ink-lt:      #78716C;
      --grid:        #E2E0DF;
      --row-alt:     #FAFAF9;
      --white:       #FFFFFF;
      --font:        'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Screen body ───────────────────────────────────── */
    body {
      font-family: var(--font);
      background: #D6D3D1;
      padding: 32px 16px 56px;
      color: var(--ink);
    }

    /* ── Page card (looks like paper on screen) ────────── */
    .page {
      background: var(--white);
      width: min(1160px, 96vw);
      margin: 0 auto 40px;
      padding: 18px 20px 14px;
      box-shadow: 0 3px 20px rgba(0,0,0,.13), 0 0 0 1px rgba(0,0,0,.06);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Large decorative watermark ─────────────────────── */
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 460px;
      line-height: 1;
      color: var(--orange);
      opacity: 0.030;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    /* Ensure all real content sits above the watermark */
    .page > *:not(.watermark) { position: relative; z-index: 1; }

    /* ── Page header ────────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 11px;
      margin-bottom: 11px;
      border-bottom: 2.5px solid var(--orange);
      flex-shrink: 0;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .wordmark-claude {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--orange);
    }

    .wordmark-sep {
      font-size: 11px;
      color: var(--orange);
      opacity: 0.65;
      line-height: 1;
    }

    .wordmark-planner {
      font-size: 13.5px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--ink-mid);
    }

    .week-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.01em;
      text-align: center;
    }

    .print-btn {
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 7px 17px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: background .15s;
      white-space: nowrap;
    }
    .print-btn:hover { background: var(--orange-dk); }

    /* ── Calendar grid ──────────────────────────────────── */
    .calendar-grid {
      display: grid;
      grid-template-columns: 52px repeat(7, 1fr);
      border: 1.5px solid var(--grid);
      border-radius: 5px;
      overflow: hidden;
      flex: 1;
    }

    /* Corner */
    .grid-corner {
      background: var(--row-alt);
      border-right: 1.5px solid var(--grid);
      border-bottom: 2px solid var(--grid);
    }

    /* ── Day header cells ───────────────────────────────── */
    .day-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 3px;
      background: var(--row-alt);
      border-right: 1px solid var(--grid);
      border-bottom: 2px solid var(--grid);
      gap: 3px;
    }
    .day-header:last-child { border-right: none; }

    .day-name {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-lt);
    }

    .day-num {
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.1;
    }

    /* Today highlight */
    .day-header.today {
      background: var(--orange-pale);
    }
    .day-header.today .day-num  { color: var(--orange-dk); }
    .day-header.today .day-name { color: var(--orange); }

    /* ── Time label cells ───────────────────────────────── */
    .time-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-mid);
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 4px 6px 0 0;
      border-right: 1.5px solid var(--grid);
      border-bottom: 1px solid var(--grid);
      background: var(--white);
    }
    .time-label.alt    { background: var(--row-alt); }
    .time-label.r-last { border-bottom: none; }

    /* ── Time slot cells ────────────────────────────────── */
    .time-slot {
      border-right: 1px solid var(--grid);
      border-bottom: 1px solid var(--grid);
      min-height: 32px;
      /* half-hour hairline at 50% */
      background-image: linear-gradient(
        to bottom,
        transparent calc(50% - 0.5px),
        rgba(0,0,0,.09) calc(50% - 0.5px),
        rgba(0,0,0,.09) 50%,
        transparent 50%
      );
    }
    .time-slot:last-child   { border-right: none; }
    .time-slot.alt          { background-color: var(--row-alt); }
    .time-slot.r-last       { border-bottom: none; }
    .time-slot.today-col    { background-color: var(--orange-tint) !important; }

    /* ── Page footer decoration ─────────────────────────── */
    .page-footer {
      margin-top: 8px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.55em;
      color: var(--orange);
      opacity: 0.45;
      flex-shrink: 0;
    }

    /* ── Page 2 layout ──────────────────────────────────── */
    .bottom-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      flex: 1;
    }

    .panel {
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      padding: 0 0 8px 11px;
      margin-bottom: 10px;
      border-left: 3px solid var(--orange);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .panel-header .spark {
      color: var(--orange);
      font-size: 10px;
      line-height: 1;
    }

    /* ── To-do list ─────────────────────────────────────── */
    .todo-list {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 30px;
      border-bottom: 1px dotted var(--grid);
      padding: 3px 0;
    }
    .todo-item:last-child { border-bottom: none; }

    .checkbox {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--ink-lt);
      border-radius: 2px;
      display: inline-block;
    }

    .todo-line {
      flex: 1;
      height: 100%;
    }

    /* ── Notes area ─────────────────────────────────────── */
    .notes-area {
      flex: 1;
      min-height: 260px;
      border: 1.5px solid var(--grid);
      border-radius: 4px;
      padding: 3px 10px;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent calc(1.9em - 1px),
        var(--grid) calc(1.9em - 1px),
        var(--grid) 1.9em
      );
      background-attachment: local;
      line-height: 1.9em;
    }

    /* ── Page 2 label ───────────────────────────────────── */
    .page-tag {
      font-size: 11px;
      color: var(--ink-lt);
      font-style: italic;
      font-weight: 300;
    }

    /* ═══════════════════════════════════════════════════════
       PRINT STYLES
    ═══════════════════════════════════════════════════════ */
    @page {
      size: letter landscape;
      margin: 10mm 12mm;
    }

    @media print {
      /* Force color output so orange accents survive printing */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      body { background: white; padding: 0; }

      .page {
        width: 100%;
        height: 195mm;          /* letter landscape usable height (215.9 - 20mm margins) */
        margin: 0;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
        page-break-after: always;
        break-after: page;
      }

      .page-2 {
        page-break-after: auto;
        break-after: auto;
      }

      .no-print { display: none !important; }

      /* ── Print: page header ─── */
      .page-header {
        padding-bottom: 3mm;
        margin-bottom: 3mm;
      }
      .wordmark-claude  { font-size: 11pt; }
      .wordmark-planner { font-size: 10pt; }
      .wordmark-sep     { font-size: 9pt; }
      .week-title       { font-size: 11pt; }

      /* ── Print: calendar grid ── */
      .calendar-grid {
        height: 172mm;  /* page 195mm - header ~14mm - footer ~7mm - gap ~2mm */
        grid-template-rows: 12mm repeat(15, 1fr);
        border-radius: 0;
      }

      .day-name { font-size: 7pt; }
      .day-num  { font-size: 13pt; }
      .time-label { font-size: 8pt; padding-top: 2px; }
      .time-slot  { min-height: 0; }

      /* ── Print: page footer ─── */
      .page-footer { margin-top: 2mm; }

      /* ── Print: panel headers ── */
      .panel-header { font-size: 10pt; }

      /* ── Print: to-do rows ───── */
      .todo-item { min-height: 9mm; }
      .checkbox  { width: 13px; height: 13px; }

      /* ── Print: notes ruled lines at 9 mm pitch ── */
      .notes-area {
        min-height: 0;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent calc(9mm - 1px),
          #E2E0DF calc(9mm - 1px),
          #E2E0DF 9mm
        );
        line-height: 9mm;
      }
    }

  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     PAGE 1 — WEEKLY SCHEDULE
═══════════════════════════════════════════════ -->
<div class="page page-1">
  <div class="watermark" aria-hidden="true">✦</div>

  <header class="page-header">
    <div class="wordmark">
      <span class="wordmark-claude">CLAUDE</span>
      <span class="wordmark-sep">✦</span>
      <span class="wordmark-planner">Weekly Planner</span>
    </div>
    <div class="week-title">Week of &nbsp;<span id="week-range">—</span></div>
    <button class="print-btn no-print" onclick="window.print()">✦&thinsp; Print Planner</button>
  </header>

  <div class="calendar-grid">
    <div class="grid-corner"></div>

    <!-- Day headers -->
    <div class="day-header" id="col-0"><div class="day-name">Mon</div><div class="day-num" id="dn-0">—</div></div>
    <div class="day-header" id="col-1"><div class="day-name">Tue</div><div class="day-num" id="dn-1">—</div></div>
    <div class="day-header" id="col-2"><div class="day-name">Wed</div><div class="day-num" id="dn-2">—</div></div>
    <div class="day-header" id="col-3"><div class="day-name">Thu</div><div class="day-num" id="dn-3">—</div></div>
    <div class="day-header" id="col-4"><div class="day-name">Fri</div><div class="day-num" id="dn-4">—</div></div>
    <div class="day-header" id="col-5"><div class="day-name">Sat</div><div class="day-num" id="dn-5">—</div></div>
    <div class="day-header" id="col-6"><div class="day-name">Sun</div><div class="day-num" id="dn-6">—</div></div>

    <!-- 6 AM -->
    <div class="time-label">6 AM</div>
    <div class="time-slot" data-col="0"></div><div class="time-slot" data-col="1"></div><div class="time-slot" data-col="2"></div><div class="time-slot" data-col="3"></div><div class="time-slot" data-col="4"></div><div class="time-slot" data-col="5"></div><div class="time-slot" data-col="6"></div>

    <!-- 7 AM -->
    <div class="time-label alt">7 AM</div>
    <div class="time-slot alt" data-col="0"></div><div class="time-slot alt" data-col="1"></div><div class="time-slot alt" data-col="2"></div><div class="time-slot alt" data-col="3"></div><div class="time-slot alt" data-col="4"></div><div class="time-slot alt" data-col="5"></div><div class="time-slot alt" data-col="6"></div>

    <!-- 8 AM -->
    <div class="time-label">8 AM</div>
    <div class="time-slot" data-col="0"></div><div class="time-slot" data-col="1"></div><div class="time-slot" data-col="2"></div><div class="time-slot" data-col="3"></div><div class="time-slot" data-col="4"></div><div class="time-slot" data-col="5"></div><div class="time-slot" data-col="6"></div>

    <!-- 9 AM -->
    <div class="time-label alt">9 AM</div>
    <div class="time-slot alt" data-col="0"></div><div class="time-slot alt" data-col="1"></div><div class="time-slot alt" data-col="2"></div><div class="time-slot alt" data-col="3"></div><div class="time-slot alt" data-col="4"></div><div class="time-slot alt" data-col="5"></div><div class="time-slot alt" data-col="6"></div>

    <!-- 10 AM -->
    <div class="time-label">10 AM</div>
    <div class="time-slot" data-col="0"></div><div class="time-slot" data-col="1"></div><div class="time-slot" data-col="2"></div><div class="time-slot" data-col="3"></div><div class="time-slot" data-col="4"></div><div class="time-slot" data-col="5"></div><div class="time-slot" data-col="6"></div>

    <!-- 11 AM -->
    <div class="time-label alt">11 AM</div>
    <div class="time-slot alt" data-col="0"></div><div class="time-slot alt" data-col="1"></div><div class="time-slot alt" data-col="2"></div><div class="time-slot alt" data-col="3"></div><div class="time-slot alt" data-col="4"></div><div class="time-slot alt" data-col="5"></div><div class="time-slot alt" data-col="6"></div>

    <!-- 12 PM -->
    <div class="time-label">12 PM</div>
    <div class="time-slot" data-col="0"></div><div class="time-slot" data-col="1"></div><div class="time-slot" data-col="2"></div><div class="time-slot" data-col="3"></div><div class="time-slot" data-col="4"></div><div class="time-slot" data-col="5"></div><div class="time-slot" data-col="6"></div>

    <!-- 1 PM -->
    <div class="time-label alt">1 PM</div>
    <div class="time-slot alt" data-col="0"></div><div class="time-slot alt" data-col="1"></div><div class="time-slot alt" data-col="2"></div><div class="time-slot alt" data-col="3"></div><div class="time-slot alt" data-col="4"></div><div class="time-slot alt" data-col="5"></div><div class="time-slot alt" data-col="6"></div>

    <!-- 2 PM -->
    <div class="time-label">2 PM</div>
    <div class="time-slot" data-col="0"></div><div class="time-slot" data-col="1"></div><div class="time-slot" data-col="2"></div><div class="time-slot" data-col="3"></div><div class="time-slot" data-col="4"></div><div class="time-slot" data-col="5"></div><div class="time-slot" data-col="6"></div>

    <!-- 3 PM -->
    <div class="time-label alt">3 PM</div>
    <div class="time-slot alt" data-col="0"></div><div class="time-slot alt" data-col="1"></div><div class="time-slot alt" data-col="2"></div><div class="time-slot alt" data-col="3"></div><div class="time-slot alt" data-col="4"></div><div class="time-slot alt" data-col="5"></div><div class="time-slot alt" data-col="6"></div>

    <!-- 4 PM -->
    <div class="time-label">4 PM</div>
    <div class="time-slot" data-col="0"></div><div class="time-slot" data-col="1"></div><div class="time-slot" data-col="2"></div><div class="time-slot" data-col="3"></div><div class="time-slot" data-col="4"></div><div class="time-slot" data-col="5"></div><div class="time-slot" data-col="6"></div>

    <!-- 5 PM -->
    <div class="time-label alt">5 PM</div>
    <div class="time-slot alt" data-col="0"></div><div class="time-slot alt" data-col="1"></div><div class="time-slot alt" data-col="2"></div><div class="time-slot alt" data-col="3"></div><div class="time-slot alt" data-col="4"></div><div class="time-slot alt" data-col="5"></div><div class="time-slot alt" data-col="6"></div>

    <!-- 6 PM -->
    <div class="time-label">6 PM</div>
    <div class="time-slot" data-col="0"></div><div class="time-slot" data-col="1"></div><div class="time-slot" data-col="2"></div><div class="time-slot" data-col="3"></div><div class="time-slot" data-col="4"></div><div class="time-slot" data-col="5"></div><div class="time-slot" data-col="6"></div>

    <!-- 7 PM -->
    <div class="time-label alt">7 PM</div>
    <div class="time-slot alt" data-col="0"></div><div class="time-slot alt" data-col="1"></div><div class="time-slot alt" data-col="2"></div><div class="time-slot alt" data-col="3"></div><div class="time-slot alt" data-col="4"></div><div class="time-slot alt" data-col="5"></div><div class="time-slot alt" data-col="6"></div>

    <!-- 8 PM — last row, covers 8:00–9:00 PM -->
    <div class="time-label r-last">8 PM</div>
    <div class="time-slot r-last" data-col="0"></div><div class="time-slot r-last" data-col="1"></div><div class="time-slot r-last" data-col="2"></div><div class="time-slot r-last" data-col="3"></div><div class="time-slot r-last" data-col="4"></div><div class="time-slot r-last" data-col="5"></div><div class="time-slot r-last" data-col="6"></div>
  </div>

  <div class="page-footer">✦ &nbsp; ✦ &nbsp; ✦</div>
</div>


<!-- ═══════════════════════════════════════════════
     PAGE 2 — TO-DO LIST & NOTES
═══════════════════════════════════════════════ -->
<div class="page page-2">
  <div class="watermark" aria-hidden="true">✦</div>

  <header class="page-header">
    <div class="wordmark">
      <span class="wordmark-claude">CLAUDE</span>
      <span class="wordmark-sep">✦</span>
      <span class="wordmark-planner">Weekly Planner</span>
    </div>
    <div class="week-title">Week of &nbsp;<span id="week-range-p2">—</span></div>
    <span class="page-tag no-print">Page 2 of 2</span>
  </header>

  <div class="bottom-content">

    <!-- To-Do Panel -->
    <div class="panel">
      <h2 class="panel-header"><span class="spark">✦</span> To-Do This Week</h2>
      <div class="todo-list">
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
        <div class="todo-item"><span class="checkbox"></span><span class="todo-line"></span></div>
      </div>
    </div>

    <!-- Notes Panel -->
    <div class="panel">
      <h2 class="panel-header"><span class="spark">✦</span> Notes</h2>
      <div class="notes-area"></div>
    </div>

  </div>

  <div class="page-footer">✦ &nbsp; ✦ &nbsp; ✦</div>
</div>


<script>
(function () {
  const today    = new Date();
  const todayStr = today.toDateString();

  // Find Monday of the current week
  const dow        = today.getDay(); // 0 = Sun
  const toMonday   = dow === 0 ? -6 : 1 - dow;
  const monday     = new Date(today);
  monday.setDate(today.getDate() + toMonday);

  // Inject date numbers and mark today
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);

    const numEl = document.getElementById('dn-' + i);
    if (numEl) numEl.textContent = d.getDate();

    const colEl = document.getElementById('col-' + i);
    if (colEl && d.toDateString() === todayStr) {
      colEl.classList.add('today');
      document.querySelectorAll('.time-slot[data-col="' + i + '"]').forEach(function (el) {
        el.classList.add('today-col');
      });
    }
  }

  // Week range label
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);

  const fmt  = function (d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  const text = fmt(monday) + ' – ' + fmt(sunday) + ', ' + sunday.getFullYear();

  var r1 = document.getElementById('week-range');
  var r2 = document.getElementById('week-range-p2');
  if (r1) r1.textContent = text;
  if (r2) r2.textContent = text;
})();
</script>

</body>
</html>
